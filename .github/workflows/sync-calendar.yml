name: Sync calendar

on:
  schedule:
    # Weekly fallback, Fridays ~17:30 CEST/16:30 CET (15:30 UTC, cron is UTC
    # so this drifts 1h across DST) — timed ~30min after the local
    # "leoasal-calendar-weekly-sync" scheduled task (Fridays 17:00 local),
    # which already triggers this workflow itself via workflow_dispatch once
    # it's done editing "WEBSITE TERMINE". This cron only matters as a
    # fallback if that local task didn't run (e.g. Claude app was closed).
    - cron: "30 15 * * 5"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch calendar and rebuild data/dates.json
        env:
          CALENDAR_URL: ${{ secrets.CALENDAR_URL }}
        run: node scripts/sync-calendar.js

      - name: Commit changes if any
        id: commit
        run: |
          if git diff --quiet -- data/dates.json data/dates.ics; then
            echo "No changes to dates.json/dates.ics"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "leoasal-website-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/dates.json data/dates.ics
          git commit -m "Sync dates from calendar"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # A push made with the default GITHUB_TOKEN does not trigger other
      # workflows (GitHub's built-in loop prevention) — so Deploy Pages would
      # never run automatically after a calendar sync. Trigger it explicitly.
      - name: Trigger Pages deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-pages.yml --ref main
